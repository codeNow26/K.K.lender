name: Deploy K.K.Lender to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kklender-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch matching New Horizons portrait icons
        run: |
          mkdir -p public/images
          curl --fail --silent --show-error --location --retry 3 --max-time 45 'https://soopool.art/img/infoacnh/Neighbor/squ17.png' -o public/images/huschke-head.png
          curl --fail --silent --show-error --location --retry 3 --max-time 45 'https://soopool.art/img/infoacnh/Neighbor/squ21.png' -o public/images/ione-head.png
          python -c "from pathlib import Path; assert all(p.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')) for p in map(Path, ['public/images/huschke-head.png', 'public/images/ione-head.png']))"
      - run: npm run build
      - name: Upload Angular build via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -eu
          test -s dist/inselkalender/browser/index.html
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 update
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3 install -y lftp
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "access-5020380091.webspace-host.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbBMvvDjN4IP04VAZlDH42A+HL25ifeIK9CorAvaMA/" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" -p 22 "sftp://$SFTP_HOST" <<'EOF'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set sftp:auto-confirm no
          mirror --reverse --verbose --exclude-glob index.html dist/inselkalender/browser/ ./
          put dist/inselkalender/browser/.htaccess -o .htaccess
          put dist/inselkalender/browser/index.html -o index.html
          bye
          EOF

      - name: Verify the actual live app and audio
        run: |
          set -eu
          base=https://kklender.philipp-nowotnick.de
          curl --fail --silent --show-error --retry 3 "$base/?v=${GITHUB_SHA}" -o /tmp/live-index.html
          cmp dist/inselkalender/browser/index.html /tmp/live-index.html
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' "$base/" -o /tmp/live-root.html
          cmp dist/inselkalender/browser/index.html /tmp/live-root.html
          curl --fail --silent --show-error --retry 3 "$base/Music/Background-Music.m4a?v=16bff387" -o /tmp/live-background.m4a
          cmp dist/inselkalender/browser/Music/Background-Music.m4a /tmp/live-background.m4a
          curl --fail --silent --show-error --head "$base/" | grep -i '^cache-control:'
