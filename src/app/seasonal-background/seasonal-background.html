<div class="seasonal-scene" [attr.data-season]="season()" aria-hidden="true">
  @for (particle of particles; track $index) {
    <span class="particle"
      [style.left.%]="particle.x"
      [style.width.px]="particle.size"
      [style.--duration]="particle.duration + 's'"
      [style.--delay]="particle.delay + 's'"
      [style.--drift]="particle.drift + 'px'">
      <svg viewBox="0 0 24 24" focusable="false">
        @switch (season()) {
          @case ('winter') {
            <path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 3 3-3M9 20l3-3 3 3M3 11l4-1-1-4M18 18l-1-4 4-1M3 13l4 1-1 4M18 6l-1 4 4 1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          }
          @case ('spring') {
            <path d="M12 21C4 19 2 12 6 6c2-3 5-2 6 1 1-3 4-4 6-1 4 6 2 13-6 15Z" fill="currentColor"/>
          }
          @case ('autumn') {
            <path d="M4 20C2 10 8 4 21 3c0 12-6 18-14 16l-3 3-1-1Z" fill="currentColor"/>
            <path d="m6 18 11-11" fill="none" stroke="#fffdf2" stroke-width="1.2" stroke-linecap="round"/>
          }
          @case ('summer') {
            <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
            <path d="M12 3v3m0 12v3M3 12h3m12 0h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          }
        }
      </svg>
    </span>
  }
</div>
