<div class="seasonal-scene" [attr.data-season]="season()" aria-hidden="true">
  @for (particle of particles; track $index) {
    <span class="particle"
      [style.left.%]="particle.x"
      [style.width.px]="particle.size"
      [style.--duration]="particle.duration + 's'"
      [style.--delay]="particle.delay + 's'"
      [style.--drift]="particle.drift + 'px'">
      <svg viewBox="0 0 24 24" focusable="false">
        @switch (season()) {
          @case ('winter') {
            <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
              @for (angle of [0, 60, 120, 180, 240, 300]; track angle) {
                <path [attr.transform]="'rotate(' + angle + ' 12 12)'" d="M12 12V2.5M8.8 5.5 12 8.5 15.2 5.5"/>
              }
            </g>
          }
          @case ('spring') {
            <path d="M12 22C7 17 3 13 3.8 7.6 4.5 2.8 8.2 1.8 12 5.1 15.8 1.8 19.5 2.8 20.2 7.6 21 13 17 17 12 22Z" fill="currentColor"/>
            <path d="M12 20C10.8 15 10.6 11 12 7" fill="none" stroke="#fff4f5" stroke-width=".8" opacity=".8"/>
          }
          @case ('autumn') {
            <path d="M4 21C7 17 10 14 12 10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            <path d="M6 17C2 13 4 8 9 5c4-2 8-1 12-3-1 5 0 10-4 14-3 3-8 4-11 1Z" fill="currentColor"/>
            <path d="M7 17 17 6M10 13l-1-5m4 2 4 1" fill="none" stroke="#fff7df" stroke-width=".8" stroke-linecap="round" opacity=".8"/>
          }
          @case ('summer') {
            <circle cx="12" cy="12" r="9" fill="currentColor" opacity=".12"/>
            <circle cx="12" cy="12" r="5.5" fill="currentColor" opacity=".25"/>
            <circle cx="12" cy="12" r="2.8" fill="#fff5c3"/>
            <circle cx="11" cy="11" r="1.4" fill="#fffdf5"/>
          }
        }
      </svg>
    </span>
  }
</div>
